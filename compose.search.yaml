services:
  bug-paw-web:
    environment:
      BUG_PAW_MANAGED_SEARCH_AVAILABLE: "true"
      WEB_RESEARCH_EGRESS_PROFILES_PATH: /run/bugpaw/web-research-egress-profiles.json
      WEB_RESEARCH_TRUSTED_FAKE_IP_CIDRS: ${WEB_RESEARCH_TRUSTED_FAKE_IP_CIDRS:-198.18.0.0/15}
    volumes:
      - ${WEB_RESEARCH_EGRESS_PROFILES_FILE:-./config/web-research-egress-profiles.json}:/run/bugpaw/web-research-egress-profiles.json:ro
    depends_on:
      bug-paw-search:
        condition: service_started

  bug-paw-search:
    image: docker.io/searxng/searxng:latest
    container_name: bug-paw-search
    init: true
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?请在部署环境中设置 SearXNG 服务密钥}
      SEARXNG_LIMITER: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - ${BUG_PAW_DATA_DIR:-./pi-agent-data}/searxng/cache:/var/cache/searxng
    depends_on:
      bug-paw-cache:
        condition: service_started

  bug-paw-cache:
    image: docker.io/valkey/valkey:9-alpine
    container_name: bug-paw-cache
    init: true
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - ${BUG_PAW_DATA_DIR:-./pi-agent-data}/searxng/valkey:/data
